name: Publish to IPFS (decentralized)

# Builds the app for a root-served, content-addressed host (empty basePath) and
# pins it to IPFS via Storacha. Every instance is then reachable at
# https://<CID>.ipfs.dweb.link/app/?i=<distributionManager> — and, once an ENS
# name's contenthash is pointed at the CID, at https://<name>.eth.limo/app/?i=…
#
# Manual by default so it doesn't double-deploy on every push. The ENS
# contenthash update is intentionally a separate, human/key-guarded step — no
# private keys live in CI.

on:
  workflow_dispatch:

# Pinning only needs to read the repo; no Pages permissions.
permissions:
  contents: read

concurrency:
  group: ipfs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 (our packageManager) requires Node >= 22.13
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export (root-served, empty basePath)
        run: pnpm build:ipfs
        env:
          # Intentionally NO NEXT_PUBLIC_BASE_PATH — the IPFS/ENS build is served
          # from an origin-isolated root (a CID subdomain gateway or eth.limo),
          # where absolute /_next asset paths resolve correctly. A path gateway
          # (/ipfs/<CID>/…) is NOT supported — advertise a root URL only.
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL }}
          NEXT_PUBLIC_DEPLOYER_ADDRESS: ${{ vars.NEXT_PUBLIC_DEPLOYER_ADDRESS }}
          # Bakes the eth.limo share-link + ENS-host resolution into the bundle.
          NEXT_PUBLIC_ENS_HOST: ${{ vars.NEXT_PUBLIC_ENS_HOST }}
          NEXT_PUBLIC_ENS_RPC_URL: ${{ vars.NEXT_PUBLIC_ENS_RPC_URL }}

      - name: Pin ./out to IPFS (Storacha)
        id: ipfs
        uses: storacha/add-to-web3@v4
        with:
          path_to_add: "out"
          secret_key: ${{ secrets.STORACHA_PRINCIPAL }}
          proof: ${{ secrets.STORACHA_PROOF }}

      - name: Summary
        run: |
          CID="${{ steps.ipfs.outputs.cid }}"
          {
            echo "## Published to IPFS"
            echo ""
            echo "- **CID:** \`$CID\`"
            echo "- **dweb.link:** https://$CID.ipfs.dweb.link/app/"
            echo "- **w3s.link:** https://$CID.ipfs.w3s.link/app/"
            echo ""
            echo "Per-instance page: append \`?i=<distributionManager>\` to the /app/ URL."
            echo ""
            echo "### Make it permanent (manual, one mainnet tx)"
            echo "Point your ENS name's contenthash at \`ipfs://$CID\`, then it's live at"
            echo "\`https://<name>.eth.limo/app/?i=<distributionManager>\`. No private keys in CI."
          } >> "$GITHUB_STEP_SUMMARY"
